<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CaseFlow</title><style>
*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f2f5fa;color:#172c47}header{background:#173455;color:white;padding:25px}main{max-width:1100px;margin:auto;padding:24px}.metrics{display:flex;gap:16px;flex-wrap:wrap}.metric,section{background:white;border:1px solid #d9e1ed;border-radius:12px;padding:20px}.metric{flex:1;min-width:130px}strong{display:block;font-size:30px}section{margin-top:20px;overflow:auto}form{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px;border:1px solid #bfcbdc;border-radius:7px}button{background:#235c9e;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px;border-bottom:1px solid #e5eaf1}small{color:#52657d}</style>
<header><h1>CaseFlow</h1>Gestión empresarial de casos · Demostración</header><main><div class="metrics"><div class="metric">Total<strong id="total">0</strong></div><div class="metric">Abiertos<strong id="open">0</strong></div><div class="metric">En proceso<strong id="progress">0</strong></div><div class="metric">Resueltos<strong id="resolved">0</strong></div></div>
<section><h2>Nuevo caso</h2><form id="form"><input id="title" placeholder="Título del caso" required minlength="3" maxlength="160"><input id="owner" placeholder="Responsable ficticio" required maxlength="80"><select id="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select><button>Registrar</button></form><p id="message" role="status"></p></section><section><h2>Casos registrados</h2><small>Solo datos ficticios. No introducir información confidencial.</small><table><thead><tr><th>ID</th><th>Título</th><th>Responsable</th><th>Prioridad</th><th>Estado</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script>
const $=id=>document.getElementById(id);
async function api(path,options){const r=await fetch(path,options);if(!r.ok)throw Error('Error HTTP '+r.status);return r.json()}
const send=(method,body)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
async function load(){try{const data=await api('/api/cases');$('total').textContent=data.length;for(const [id,s] of [['open','OPEN'],['progress','IN_PROGRESS'],['resolved','RESOLVED']])$(id).textContent=data.filter(c=>c.status===s).length;$('rows').replaceChildren();for(const c of data){const tr=document.createElement('tr');for(const v of [c.id,c.title,c.owner,c.priority]){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td'),sel=document.createElement('select');for(const s of ['OPEN','IN_PROGRESS','RESOLVED'])sel.add(new Option(s,s,false,s===c.status));sel.onchange=async()=>{try{await api('/api/cases/'+c.id,send('PATCH',{status:sel.value}));await load()}catch(e){$('message').textContent=e.message;await load()}};td.append(sel);tr.append(td);$('rows').append(tr)}}catch(e){$('message').textContent=e.message}}
$('form').onsubmit=async e=>{e.preventDefault();try{await api('/api/cases',send('POST',{title:$('title').value,owner:$('owner').value,priority:$('priority').value}));e.target.reset();$('message').textContent='Caso registrado';await load()}catch(e){$('message').textContent=e.message}};load();
</script></html>
